<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<!-- ▼▼ 只要改這一行：把 Apps Script「網頁應用程式」網址（結尾 /exec，不要加 ?key=）貼在引號裡 ▼▼ -->
<script>const APP_URL = 'https://script.google.com/macros/s/AKfycbx0hBKMxEgKxRBmSt6olIl5xceHnA4BrSrcIxqNp0rgS_0sXVScNJiDIBZFZKe7amVEmw/exec';</script>
<!-- ▲▲ -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b5452b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="擺渡訂單">
<title>擺渡訂單</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#f6f3ee;overflow:hidden;font-family:"PingFang TC","Noto Sans TC",system-ui,sans-serif}
  body{padding-top:env(safe-area-inset-top);box-sizing:border-box}
  iframe{display:block;border:0;width:100%;height:100%}
  .splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#f6f3ee;color:#7a6f66;transition:opacity .3s}
  .splash img{width:88px;height:88px;border-radius:22px}
  .splash.hide{opacity:0;pointer-events:none}
  .err{max-width:320px;text-align:center;line-height:1.6;color:#b5452b}
</style>
</head>
<body>
<div class="splash" id="splash"><img src="icon-192.png" alt=""><div id="msg">載入中…</div></div>
<script>
  const sp=document.getElementById('splash'),msg=document.getElementById('msg');
  if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(APP_URL)){
    msg.className='err';msg.textContent='還沒設定網址：請在 index.html 最上面 APP_URL 貼上 Apps Script 網頁應用程式網址（結尾 /exec）。';
  }else if(!navigator.onLine){
    msg.className='err';msg.textContent='目前沒有網路，連上網路後再打開。';
  }else{
    const f=document.createElement('iframe');f.src=APP_URL;f.allow='clipboard-write; vibrate';
    f.onload=()=>{sp.classList.add('hide')};document.body.appendChild(f);
    setTimeout(()=>sp.classList.add('hide'),8000);
  }
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  window.addEventListener('online',()=>location.reload());
</script>
</body>
</html>
